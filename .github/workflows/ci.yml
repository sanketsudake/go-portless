name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        module: [".", "k8s", "cmd/portless"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=2 ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  core-deps:
    name: core stays stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check non-test imports are stdlib-only
        run: |
          deps=$(go list -deps ./... | grep -v '^github.com/sanketsudake/go-portless' || true)
          nonstd=$(echo "$deps" | xargs -r go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' 2>/dev/null || true)
          if [ -n "$nonstd" ]; then
            echo "core module imports non-stdlib packages in non-test code:"
            echo "$nonstd"
            exit 1
          fi

  lint:
    strategy:
      matrix:
        module: [".", "k8s", "cmd/portless"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "k8s", "cmd/portless"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  e2e-kind:
    name: k8s port-forward e2e (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: helm/kind-action@v1
        with:
          cluster_name: portless-e2e
      - name: Run e2e (pod-delete self-heal)
        working-directory: k8s
        run: go test -tags kinde2e -timeout 10m -run TestE2E ./...

  # The flake is how this CLI reaches nix users (sanketsudake/dotfiles installs
  # it that way), and its vendorHash goes stale whenever go.sum moves. Building
  # it here makes the PR that moves go.sum go red, instead of the break landing
  # on a machine downstream.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Build the flake package
        run: nix build .#portless --print-build-logs
      - name: Smoke-test the built binary
        run: ./result/bin/portless --version

  # The Homebrew cask this repo publishes is generated from .goreleaser.yaml, so
  # a mistake in the homebrew_casks block otherwise surfaces at tag time, inside
  # a release. `check` validates the config on every push instead.
  #
  # The schema probe is the trigger for dropping the custom_block workaround:
  # `hooks.post.install_steps` is unreleased (goreleaser#6873), and this warns
  # on the first push after it lands.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Notice when hooks.post.install_steps ships
        run: |
          if goreleaser schema | jq -e '.["$defs"].HomebrewCaskHook.properties.install_steps' >/dev/null; then
            echo "::warning::hooks.post.install_steps is available — migrate off custom_block (goreleaser#6873)"
          fi
